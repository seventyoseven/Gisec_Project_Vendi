<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendi — Vendor Cyber Risk Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC;
    --paper-raised:#FFFFFF;
    --ink:#1E2A2E;
    --ink-soft:#5B6B6E;
    --slate:#256B67;
    --slate-light:#E4EFEC;
    --rule:#E3DFD2;
    --rule-strong:#C9C3B2;
    --low:#2F7A52;
    --low-bg:#E7F3EA;
    --med:#B0791A;
    --med-bg:#F7EEDC;
    --high:#B03A3A;
    --high-bg:#F7E8E6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15.5px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.serif{font-family:'Source Serif 4', serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--slate);color:#fff;}

  #app{display:flex;min-height:100vh;}

  /* ---------- Rail ---------- */
  .rail{
    width:236px;
    flex-shrink:0;
    background:#16211F;
    color:#DCE6E2;
    display:flex;
    flex-direction:column;
    padding:30px 24px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .rail .mark{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .rail .mark svg{flex-shrink:0;}
  .rail .mark-text{font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;color:#fff;letter-spacing:0.2px;}
  .rail .tagline{font-size:11.5px;color:#8FA39D;margin-bottom:34px;line-height:1.5;padding-bottom:22px;border-bottom:1px solid #2A3A37;}
  .rail nav{display:flex;flex-direction:column;gap:3px;}
  .rail nav button{
    background:none;border:none;color:#AFC0BB;text-align:left;
    padding:10px 12px;border-radius:4px;font-size:13.5px;
    display:flex;align-items:center;gap:9px;
  }
  .rail nav button .dot{width:5px;height:5px;border-radius:50%;background:#3F544F;flex-shrink:0;}
  .rail nav button.active{background:#223531;color:#fff;}
  .rail nav button.active .dot{background:#5FBBAE;}
  .rail nav button:disabled{opacity:.4;cursor:not-allowed;}
  .rail .footer{margin-top:auto;font-size:11px;color:#5E746E;line-height:1.6;padding-top:18px;border-top:1px solid #2A3A37;}

  /* ---------- Main ---------- */
  main{flex:1;padding:48px 58px 96px;max-width:1180px;}
  .kicker{font-size:12px;color:var(--ink-soft);margin-bottom:7px;letter-spacing:0.2px;}
  .page-title{font-size:29px;font-weight:600;margin:0 0 10px;line-height:1.25;}
  .page-sub{color:var(--ink-soft);max-width:640px;font-size:14.5px;line-height:1.55;margin-bottom:36px;}
  .hairline{border:none;border-top:1px solid var(--rule);margin:34px 0;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 19px;border-radius:4px;border:1px solid var(--ink);
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:#2F413F;}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{background:#D6D1C2;border-color:#D6D1C2;color:#938E7C;cursor:not-allowed;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--rule-strong);}
  .btn.secondary:hover{background:var(--slate-light);border-color:var(--slate);}
  .btn.ghost{background:transparent;color:var(--slate);border:none;padding:6px 0;text-decoration:underline;text-underline-offset:3px;}
  .btn.ghost:hover{color:#1E5350;}

  /* ---------- Intake ---------- */
  .intake-toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px;}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:8px;}
  .slot{
    border:1px solid var(--rule);background:var(--paper-raised);
    border-radius:4px;padding:18px 18px 16px;position:relative;min-height:150px;
  }
  .slot .n{font-family:'Source Serif 4',serif;font-size:13px;color:var(--rule-strong);position:absolute;top:14px;right:16px;}
  .slot.empty{display:flex;align-items:center;justify-content:center;color:#9A9686;font-size:13px;border-style:dashed;}
  .slot h4{margin:0 0 4px;font-size:16px;font-weight:600;padding-right:24px;}
  .slot .domain{color:var(--ink-soft);font-size:12.5px;margin-bottom:12px;}
  .slot .certs-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .badge{font-size:11px;padding:3px 7px;border-radius:2px;border:1px solid var(--rule-strong);color:var(--ink-soft);}
  .badge.claimed{background:var(--slate-light);border-color:#C6D6DE;color:var(--slate);}
  .slot .remove{position:absolute;bottom:14px;left:18px;font-size:12px;color:var(--high);background:none;border:none;padding:0;text-decoration:underline;}

  .form-card{
    border:1px solid var(--rule);background:var(--paper-raised);border-radius:4px;
    padding:26px 28px;margin-top:26px;
  }
  .form-card h3{margin:0 0 4px;font-size:17px;}
  .form-card .hint{color:var(--ink-soft);font-size:13px;margin-bottom:20px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12.5px;color:var(--ink-soft);}
  .field input[type=text], .field textarea, .field select{
    border:1px solid var(--rule-strong);border-radius:3px;padding:9px 11px;font-size:13.5px;
    background:#fff;font-family:inherit;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .cert-check-row{display:flex;gap:18px;margin-top:2px;}
  .cert-check{display:flex;align-items:center;gap:7px;font-size:13px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}

  /* ---------- Loading ---------- */
  .loading-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60vh;text-align:center;
  }
  .loading-wrap h2{font-size:22px;margin-bottom:6px;}
  .loading-wrap p{color:var(--ink-soft);font-size:13.5px;margin-bottom:36px;}
  .steps{width:420px;max-width:90vw;text-align:left;}
  .step{
    display:flex;align-items:center;gap:12px;padding:11px 0;
    border-bottom:1px solid var(--rule);font-size:13.5px;color:#B4AF9F;
  }
  .step:last-child{border-bottom:none;}
  .step .mk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--rule-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;}
  .step.active{color:var(--ink);}
  .step.active .mk{border-color:var(--slate);}
  .step.done{color:var(--ink);}
  .step.done .mk{background:var(--low);border-color:var(--low);color:#fff;}

  /* ---------- Dashboard ---------- */
  .lead-banner{
    border:1px solid #C6D6C9;background:var(--low-bg);border-radius:4px;
    padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px;
  }
  .lead-banner .l-label{font-size:12px;color:#3B7A56;margin-bottom:3px;}
  .lead-banner .l-name{font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;}
  .lead-banner .l-why{font-size:13px;color:#3B5C48;max-width:520px;}
  .lead-banner .l-score{font-family:'Source Serif 4',serif;font-size:38px;font-weight:600;color:var(--low);line-height:1;}

  table.compare{width:100%;border-collapse:collapse;margin-bottom:8px;}
  table.compare th, table.compare td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--rule);font-size:13.5px;}
  table.compare thead th{font-weight:500;color:var(--ink-soft);font-size:12px;border-bottom:1px solid var(--rule-strong);}
  table.compare tbody tr.leader{background:var(--paper-raised);}
  table.compare td.vendor-name{font-weight:600;font-family:'Source Serif 4',serif;font-size:15px;}
  table.compare td.score-cell{font-family:'Source Serif 4',serif;font-size:17px;font-weight:600;}
  .risk-pill{display:inline-block;padding:3px 10px;border-radius:2px;font-size:11.5px;font-weight:500;}
  .risk-pill.Low{background:var(--low-bg);color:var(--low);}
  .risk-pill.Medium{background:var(--med-bg);color:var(--med);}
  .risk-pill.High{background:var(--high-bg);color:var(--high);}
  .view-link{font-size:12.5px;color:var(--slate);text-decoration:underline;text-underline-offset:3px;background:none;border:none;padding:0;font-family:inherit;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:44px 0 16px;}
  .section-head h3{margin:0;font-size:18px;}
  .exhibit-label{font-size:11.5px;color:var(--ink-soft);}

  .score-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:10px;}
  .score-card{border:1px solid var(--rule);border-radius:4px;padding:18px 20px;background:var(--paper-raised);}
  .score-card .sc-name{font-family:'Source Serif 4',serif;font-weight:600;font-size:15.5px;margin-bottom:14px;}
  .cat-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .cat-row .cat-label{width:96px;color:var(--ink-soft);flex-shrink:0;}
  .cat-bar-track{flex:1;height:6px;background:#E7E4D8;border-radius:3px;overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:3px;}
  .cat-row .cat-val{width:28px;text-align:right;font-weight:600;flex-shrink:0;}

  .translator{
    border:1px solid var(--rule-strong);border-left:3px solid var(--slate);border-radius:2px;
    background:#fff;padding:18px 22px;margin-bottom:14px;
  }
  .translator .tr-vendor{font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;margin-bottom:8px;}
  .translator .tr-body{font-size:13.5px;color:var(--ink);}
  .translator .tr-body b{font-weight:600;}

  /* ---------- Report ---------- */
  .report-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;}
  .report-doc{border:1px solid var(--rule);border-radius:4px;background:var(--paper-raised);padding:40px 44px;}
  .report-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:26px;}
  .report-head .rh-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .report-head h2{margin:0 0 4px;font-size:25px;}
  .report-head .rh-domain{color:var(--ink-soft);font-size:13px;}
  .report-head .rh-score-box{text-align:right;}
  .report-head .rh-score{font-family:'Source Serif 4',serif;font-size:42px;font-weight:600;line-height:1;}
  .report-head .rh-risk-label{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .r-block{margin-bottom:28px;}
  .r-block h4{font-size:13px;text-transform:none;color:var(--ink);border-bottom:1px solid var(--rule);padding-bottom:8px;margin:0 0 14px;font-weight:600;}
  .r-block p{margin:0 0 10px;font-size:13.8px;color:#2A3348;}
  .r-two-col{display:grid;grid-template-columns:1fr 1fr;gap:30px;}
  ul.r-list{margin:0;padding-left:18px;font-size:13.5px;}
  ul.r-list li{margin-bottom:7px;}
  .cert-table, .breach-table, .tech-table{width:100%;border-collapse:collapse;font-size:13px;}
  .cert-table th, .cert-table td, .breach-table th, .breach-table td, .tech-table th, .tech-table td{
    padding:9px 8px;border-bottom:1px solid var(--rule);text-align:left;
  }
  .cert-table th, .breach-table th, .tech-table th{color:var(--ink-soft);font-weight:500;font-size:11.5px;}
  .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;}
  .status-dot.valid{background:var(--low);}
  .status-dot.expired{background:var(--med);}
  .status-dot.unverified{background:var(--med);}
  .status-dot.missing{background:var(--high);}
  .status-dot.pass{background:var(--low);}
  .status-dot.warn{background:var(--med);}
  .status-dot.fail{background:var(--high);}
  .sim-note{font-size:11.5px;color:#9A9683;font-style:italic;margin-top:8px;}
  .conditions-list{list-style:none;margin:0;padding:0;}
  .conditions-list li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px;}
  .conditions-list li .c-mk{color:var(--slate);flex-shrink:0;}

  /* ---------- Remediation simulator ---------- */
  .sim-block{
    border:1px solid var(--rule-strong);border-left:3px solid var(--slate);
    background:var(--slate-light);border-radius:4px;padding:22px 24px 20px;
  }
  .sim-intro{color:var(--ink-soft);font-size:13.3px;margin:0 0 16px;max-width:560px;line-height:1.55;}
  .sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-bottom:18px;}
  .sim-item{display:flex;align-items:flex-start;gap:9px;font-size:13.3px;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:9px 11px;cursor:pointer;}
  .sim-item input{margin-top:2px;flex-shrink:0;accent-color:var(--slate);}
  .sim-item-tag{color:var(--ink-soft);font-size:11.5px;}
  .sim-result{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:14px 18px;margin-bottom:10px;flex-wrap:wrap;}
  .sim-score-pair{display:flex;align-items:center;gap:14px;}
  .sim-score-box{text-align:center;min-width:64px;}
  .ssb-label{font-size:11px;color:var(--ink-soft);margin-bottom:2px;}
  .ssb-val{font-family:'Source Serif 4',serif;font-size:24px;font-weight:600;line-height:1;margin-bottom:4px;}
  .sim-arrow{color:var(--rule-strong);font-size:16px;}
  .sim-delta{font-size:13.3px;color:var(--ink);flex:1;min-width:200px;}

  @media print{
    .rail, .report-topbar{display:none !important;}
    main{padding:0;max-width:none;}
    .report-doc{border:none;padding:0;}
  }
  @media (max-width:900px){
    .rail{display:none;}
    main{padding:26px 20px 70px;}
    .form-grid, .slots, .score-cards, .sim-grid{grid-template-columns:1fr;}
    .r-two-col{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   VENDI — Vendor Cyber Risk Intelligence (Prototype)
   All data below is synthetic demo data for prototyping.
   ========================================================= */

const WEIGHTS = { breach: 0.30, cert: 0.30, tech: 0.40 };

function riskLevel(score){
  if(score >= 80) return 'Low';
  if(score >= 60) return 'Medium';
  return 'High';
}
function riskColorVar(level){
  return level === 'Low' ? 'var(--low)' : level === 'Medium' ? 'var(--med)' : 'var(--high)';
}

/* ---------- Demo vendor library (synthetic data) ---------- */
const DEMO_LIBRARY = [
  {
    id:'meridian', name:'Meridian Cloud Systems', domain:'meridiancloud.io',
    claimed:{iso27001:true, soc2:true, uaeIA:true},
    questionnaire:{
      dataResidency:'Confirms in-region hosting for UAE government workloads with documented data residency controls.',
      incidentResponse:'Maintains a documented incident response plan, tested via tabletop exercise in the last 12 months.',
      subcontractors:'Discloses two subcontractors, both under signed data processing agreements.'
    },
    breach:{
      score:96,
      incidents:[]
    },
    certifications:[
      {name:'ISO 27001', status:'valid', note:'Certificate verified against issuing body registry, renewed 4 months ago.'},
      {name:'SOC 2 Type II', status:'valid', note:'Report dated within the last 9 months, no material exceptions noted.'},
      {name:'UAE IA', status:'valid', note:'Compliance confirmed for the relevant classification tier.'}
    ],
    tech:{
      score:92,
      checks:[
        {name:'TLS configuration', result:'pass', detail:'TLS 1.3 enforced, strong cipher suite, valid certificate chain. (Simulated check)'},
        {name:'Security headers', result:'pass', detail:'HSTS, CSP and X-Frame-Options present on primary domain. (Simulated check)'},
        {name:'DNS hygiene', result:'pass', detail:'SPF, DKIM and DMARC correctly configured; no stale records found. (Simulated check)'},
        {name:'Exposed services', result:'pass', detail:'No administrative or database ports found reachable from the public internet. (Simulated check)'}
      ]
    }
  },
  {
    id:'atlas', name:'Atlas Data Solutions', domain:'atlasdata.io',
    claimed:{iso27001:true, soc2:true, uaeIA:true},
    questionnaire:{
      dataResidency:'States regional hosting available on request; standard tier is multi-region by default.',
      incidentResponse:'Has an incident response plan; last tabletop exercise date not disclosed.',
      subcontractors:'Discloses three subcontractors; one agreement pending renewal.'
    },
    breach:{
      score:58,
      incidents:[
        {year:2024, severity:'Medium-High', description:'Unauthorized access to a customer-support database exposed contact records for roughly 40,000 individuals. Disclosed within 72 hours; remediation and customer notification completed.'}
      ]
    },
    certifications:[
      {name:'ISO 27001', status:'valid', note:'Certificate verified, renewed 7 months ago.'},
      {name:'SOC 2 Type II', status:'valid', note:'Report dated within the last 11 months.'},
      {name:'UAE IA', status:'unverified', note:'Claimed on questionnaire; issuing documentation not yet supplied for verification.'}
    ],
    tech:{
      score:70,
      checks:[
        {name:'TLS configuration', result:'pass', detail:'TLS 1.2/1.3 supported, certificate valid. Cipher suite includes some legacy options. (Simulated check)'},
        {name:'Security headers', result:'warn', detail:'HSTS present; CSP missing on two customer-facing subdomains. (Simulated check)'},
        {name:'DNS hygiene', result:'pass', detail:'SPF and DKIM configured; DMARC policy set to monitor-only rather than enforce. (Simulated check)'},
        {name:'Exposed services', result:'warn', detail:'An administrative login panel is reachable from the public internet on a staging subdomain. (Simulated check)'}
      ]
    }
  },
  {
    id:'nexora', name:'Nexora Systems', domain:'nexorasystems.io',
    claimed:{iso27001:true, soc2:false, uaeIA:false},
    questionnaire:{
      dataResidency:'No formal data residency commitment provided.',
      incidentResponse:'No documented incident response plan supplied with questionnaire response.',
      subcontractors:'Subcontractor use not disclosed.'
    },
    breach:{
      score:30,
      incidents:[
        {year:2025, severity:'High', description:'Ransomware incident disrupted internal systems for approximately five days; vendor has not published a full post-incident report.'},
        {year:2022, severity:'Medium', description:'Misconfigured cloud storage bucket exposed internal documents for an unknown period before discovery.'}
      ]
    },
    certifications:[
      {name:'ISO 27001', status:'expired', note:'Certificate lapsed 14 months ago; no evidence of renewal in progress.'},
      {name:'SOC 2 Type II', status:'missing', note:'Not claimed and no report supplied.'},
      {name:'UAE IA', status:'missing', note:'Not claimed and no compliance evidence supplied.'}
    ],
    tech:{
      score:40,
      checks:[
        {name:'TLS configuration', result:'warn', detail:'TLS 1.2 supported but with deprecated cipher suites still enabled. (Simulated check)'},
        {name:'Security headers', result:'fail', detail:'No HSTS, CSP, or X-Frame-Options headers detected on primary domain. (Simulated check)'},
        {name:'DNS hygiene', result:'fail', detail:'DMARC record absent; SPF record present but overly permissive. (Simulated check)'},
        {name:'Exposed services', result:'fail', detail:'Two internal services, including a database management interface, appear reachable from the public internet. (Simulated check)'}
      ]
    }
  },
  {
    id:'brightline', name:'Brightline Networks', domain:'brightlinenet.io',
    claimed:{iso27001:false, soc2:true, uaeIA:false},
    questionnaire:{
      dataResidency:'Offers regional hosting as an add-on, not default.',
      incidentResponse:'Documented incident response plan, no recent exercise on file.',
      subcontractors:'Discloses one subcontractor under a standard data processing agreement.'
    },
    breach:{
      score:74,
      incidents:[
        {year:2023, severity:'Low', description:'A phishing attempt against staff was detected and contained before any system access was gained; disclosed proactively.'}
      ]
    },
    certifications:[
      {name:'ISO 27001', status:'missing', note:'Not currently pursued, per vendor questionnaire response.'},
      {name:'SOC 2 Type II', status:'valid', note:'Report dated within the last 6 months.'},
      {name:'UAE IA', status:'missing', note:'Not applicable per vendor, pending confirmation.'}
    ],
    tech:{
      score:78,
      checks:[
        {name:'TLS configuration', result:'pass', detail:'TLS 1.3 enforced with a modern cipher suite. (Simulated check)'},
        {name:'Security headers', result:'pass', detail:'HSTS and CSP present; X-Frame-Options missing on one subdomain. (Simulated check)'},
        {name:'DNS hygiene', result:'warn', detail:'SPF and DKIM present; DMARC configured but set to quarantine rather than reject. (Simulated check)'},
        {name:'Exposed services', result:'pass', detail:'No unexpected public-facing services detected. (Simulated check)'}
      ]
    }
  }
];

function computeVendor(v){
  const certScore = Math.round(
    v.certifications.reduce((sum,c)=>{
      if(c.status==='valid') return sum+100;
      if(c.status==='expired') return sum+45;
      if(c.status==='unverified') return sum+55;
      return sum+10; // missing
    },0) / v.certifications.length
  );
  const overall = Math.round(v.breach.score*WEIGHTS.breach + certScore*WEIGHTS.cert + v.tech.score*WEIGHTS.tech);
  return {
    ...v,
    certScore,
    overall,
    level: riskLevel(overall)
  };
}

/* ---------- Contract Risk Translator ---------- */
function translate(v){
  const hasBreach = v.breach.incidents.length > 0;
  const severeBreach = v.breach.incidents.some(i=>i.severity==='High');
  const certsStrong = v.certScore >= 75;
  const techWeak = v.tech.score < 55;
  const overallLow = v.overall < 60;

  let summary, conditions;

  if(!hasBreach && certsStrong && v.tech.score >= 80){
    summary = `${v.name} shows no recorded breach history, strong verified certifications, and healthy technical hygiene. This profile supports award under standard baseline terms.`;
    conditions = [
      'Annual security reassessment as a standing contract condition.',
      'Standard breach notification requirement within 72 hours.',
      'Maintain current certifications for the duration of the contract.'
    ];
  } else if(hasBreach && certsStrong && !overallLow){
    summary = `${v.name} holds strong certifications but has a disclosed breach history. Recommended action: do not reject automatically. Instead, require enhanced monitoring conditions that address the specific gap the breach revealed.`;
    conditions = [
      'Mandatory breach notification within 24 hours, tightened from the standard 72-hour baseline.',
      'Independent penetration test required before contract start and annually thereafter.',
      'Enhanced subcontractor oversight, including disclosure of all data-handling subcontractors.',
      'Quarterly (rather than annual) security reassessment for the first contract year.'
    ];
  } else if(overallLow || (severeBreach && techWeak)){
    summary = `${v.name}'s combined breach history, certification gaps, and technical hygiene findings place it in the high-risk band. Recommended action: do not award without remediation. If a conditional award is considered, apply the strictest available controls.`;
    conditions = [
      'Remediation of all failed technical hygiene checks required before contract execution.',
      'Minimum certification requirement: current ISO 27001 and SOC 2 Type II, both independently verified.',
      'Mandatory breach notification within 24 hours, with a documented post-incident report within 10 business days.',
      'Independent penetration test required before award, with re-test before go-live.',
      'Right-to-audit clause with quarterly reassessment for the full contract term.'
    ];
  } else {
    summary = `${v.name} sits in a moderate risk band with a mix of adequate and weaker findings. Recommended action: proceed with targeted conditions addressing the specific weaker categories rather than blanket restrictions.`;
    conditions = [
      'Mandatory breach notification within 48 hours.',
      'Remediation plan required for any failed or warned technical hygiene checks, with a 90-day deadline.',
      'Minimum security certification requirements confirmed before contract execution.',
      'Semi-annual security reassessment for the contract term.'
    ];
  }
  return {summary, conditions};
}

/* ---------- App state ---------- */
const state = {
  view:'intake',          // intake | loading | dashboard | report
  vendors:[],              // up to 3 raw vendor objects (from library or custom form)
  reportVendorId:null,
  formOpen:false,
  simRemediated:{}         // vendorId -> { certs:Set<certName>, techs:Set<checkName> } — remediation simulator selections
};

/* ---------- Remediation impact simulator ----------
   Innovation feature: lets a reviewer tick specific certification gaps or
   failed/warned technical checks a vendor could plausibly fix, and see the
   composite score and risk band recompute live — before waiting on a full
   re-assessment cycle. Breach history is left untouched (it cannot be
   un-happened); only certification and technical-hygiene findings, which
   are genuinely fixable by a vendor, are simulated. */
function computeVendorSimulated(v, sim){
  const certScore = Math.round(
    v.certifications.reduce((sum,c)=>{
      if(sim.certs.has(c.name) || c.status==='valid') return sum+100;
      if(c.status==='expired') return sum+45;
      if(c.status==='unverified') return sum+55;
      return sum+10; // missing
    },0) / v.certifications.length
  );
  let techScore = v.tech.score;
  v.tech.checks.forEach(c=>{
    if(c.result==='pass' || !sim.techs.has(c.name)) return;
    techScore += c.result==='fail' ? 16 : 8; // heuristic point-back for a resolved fail/warn
  });
  techScore = Math.min(100, Math.round(techScore));
  const overall = Math.round(v.breach.score*WEIGHTS.breach + certScore*WEIGHTS.cert + techScore*WEIGHTS.tech);
  return { certScore, techScore, overall, level: riskLevel(overall) };
}

function runAssessment(){
  const labels = ['Checking breach disclosure records','Verifying claimed certifications','Running technical hygiene checks (simulated)','Computing composite risk scores'];
  const stepsEl = ()=>document.getElementById('steps');
  let i = 0;
  function paint(){
    const s = stepsEl();
    if(!s) return;
    s.innerHTML = labels.map((l,idx)=>{
      const cls = idx < i ? 'done' : idx===i ? 'active' : '';
      const mk = idx < i ? '✓' : '';
      return `<div class="step ${cls}"><span class="mk">${mk}</span>${l}</div>`;
    }).join('');
  }
  paint();
  const timer = setInterval(()=>{
    i++;
    paint();
    if(i >= labels.length){
      clearInterval(timer);
      setTimeout(()=>{
        if(!state.reportVendorId) state.reportVendorId = computeVendor(state.vendors[0]).id;
        state.view = 'dashboard'; render();
      }, 450);
    }
  }, 620);
}

function catRow(label, val, weight){
  const color = val>=80?'var(--low)':val>=60?'var(--med)':'var(--high)';

function leadWhy(leader, all){
  const runnerUp = all[1];
  if(!runnerUp) return 'Highest composite score in the comparison set.';
  const gap = leader.overall - runnerUp.overall;
  const strongest = leader.breach.score>=leader.certScore && leader.breach.score>=leader.tech.score ? 'a clean breach history'
    : leader.certScore>=leader.tech.score ? 'fully verified certifications' : 'strong technical hygiene';
  return `Scores ${gap} points above the next vendor, driven primarily by ${strongest}.`;
}

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function execSummary(v){
  const certValid = v.certifications.filter(c=>c.status==='valid').length;
  const breachCount = v.breach.incidents.length;
  return `${v.name} received a composite risk score of ${v.overall} out of 100, placing it in the ${v.level.toLowerCase()} risk band. `
    + `The vendor holds ${certValid} of ${v.certifications.length} claimed certifications in fully verified, valid status. `
    + (breachCount ? `${breachCount} breach ${breachCount===1?'incident is':'incidents are'} on record. ` : `No breach incidents are on record. `)
    + `Technical hygiene checks (simulated for this prototype) scored ${v.tech.score}/100.`;
}
function strengthsList(v){
  const out = [];
  if(v.breach.incidents.length===0) out.push('No disclosed breach incidents on record.');
  if(v.certifications.some(c=>c.status==='valid')) out.push(`${v.certifications.filter(c=>c.status==='valid').length} certification(s) independently verified as valid.`);
  if(v.tech.checks.filter(c=>c.result==='pass').length >= 3) out.push('Technical hygiene checks pass on the majority of criteria assessed.');
  if(out.length===0) out.push('No material strengths identified in this assessment cycle.');
  return out;
}
function keyRisksList(v){
  const out = [];
  v.breach.incidents.forEach(i=>out.push(`${i.year} — ${i.severity.toLowerCase()} severity incident: ${i.description.split('.')[0]}.`));
  v.certifications.filter(c=>c.status!=='valid').forEach(c=>out.push(`${c.name} certification is ${c.status}.`));
  v.tech.checks.filter(c=>c.result!=='pass').forEach(c=>out.push(`${c.name}: ${c.detail.split('.')[0]}.`));
  if(out.length===0) out.push('No material risks identified in this assessment cycle.');
  return out;
}

function RemediationSimulator(current){
  if(!state.simRemediated[current.id]) state.simRemediated[current.id] = { certs:new Set(), techs:new Set() };
  const sim = state.simRemediated[current.id];

  const remediableCerts = current.certifications.filter(c=>c.status!=='valid');
  const remediableTechs = current.tech.checks.filter(c=>c.result!=='pass');
  const simmed = computeVendorSimulated(current, sim);
  const delta = simmed.overall - current.overall;
  const anySelected = sim.certs.size>0 || sim.techs.size>0;

  const wrap = el('div',{class:'r-block sim-block'});
  const head = el('div',{class:'sim-head'});
  head.innerHTML = `<h4 style="border-bottom:none;padding-bottom:0;margin-bottom:2px;">Remediation impact simulator</h4>
    <p class="sim-intro">Tick the findings below that this vendor could plausibly fix, and see the composite score and risk band shift immediately — a forward-looking read alongside the point-in-time assessment above.</p>`;
  wrap.appendChild(head);

  if(remediableCerts.length===0 && remediableTechs.length===0){
    const none = el('p'); none.style.color='var(--ink-soft)'; none.style.fontSize='13.5px';
    none.textContent = 'No outstanding certification or technical-hygiene findings to remediate — this vendor is already at ceiling for both categories.';
    wrap.appendChild(none);
    return wrap;
  }

  const grid = el('div',{class:'sim-grid'});
  remediableCerts.forEach(c=>{
    const item = el('label',{class:'sim-item'});
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = sim.certs.has(c.name);
    cb.onchange = ()=>{ sim.certs.has(c.name) ? sim.certs.delete(c.name) : sim.certs.add(c.name); render(); };
    item.appendChild(cb);
    const span = el('span'); span.innerHTML = `Resolve <b>${c.name}</b> <span class="sim-item-tag">${c.status}</span>`;
    item.appendChild(span);
    grid.appendChild(item);
  });
  remediableTechs.forEach(c=>{
    const item = el('label',{class:'sim-item'});
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = sim.techs.has(c.name);
    cb.onchange = ()=>{ sim.techs.has(c.name) ? sim.techs.delete(c.name) : sim.techs.add(c.name); render(); };
    item.appendChild(cb);
    const span = el('span'); span.innerHTML = `Fix <b>${c.name}</b> <span class="sim-item-tag">${c.result}</span>`;
    item.appendChild(span);
    grid.appendChild(item);
  });
  wrap.appendChild(grid);

  const result = el('div',{class:'sim-result'});
  result.innerHTML = `
    <div class="sim-score-pair">
      <div class="sim-score-box">
        <div class="ssb-label">Current</div>
        <div class="ssb-val" style="color:${riskColorVar(current.level)}">${current.overall}</div>
        <span class="risk-pill ${current.level}">${current.level}</span>
      </div>
      <div class="sim-arrow">→</div>
      <div class="sim-score-box">
        <div class="ssb-label">Projected</div>
        <div class="ssb-val" style="color:${riskColorVar(simmed.level)}">${simmed.overall}</div>
        <span class="risk-pill ${simmed.level}">${simmed.level}</span>
      </div>
    </div>
    <div class="sim-delta">${anySelected
      ? `${delta>0?'+':''}${delta} points if the selected items are resolved${simmed.level!==current.level?`, moving this vendor into the ${simmed.level.toLowerCase()}-risk band.`:'.'}`
      : 'Select an item above to see the projected effect on score and risk band.'}</div>
  `;
  wrap.appendChild(result);

  const note = el('div',{class:'sim-note'});
  note.textContent = 'Simulated scoring for planning purposes only — treat as a discussion aid, not a substitute for re-assessment against evidence.';
  wrap.appendChild(note);

  return wrap;
}

/* ---------- DOM helper ---------- */
function el(tag, attrs){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='style') e.setAttribute('style', attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  return e;
}

render();
</script>
</body>
</html>
